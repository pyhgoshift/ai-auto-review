{{define "content"}}
{{if not .User.MustChange}}
<div class="card narrowcard">
  <h1>내 정보</h1>
  <form method="post" action="/profile">
    <input type="hidden" name="csrf" value="{{.User.CSRF}}">
    <label>아이디<input value="{{.User.Login}}" disabled></label>
    <label>이름 <small class="muted">대장·신청서의 작성자·승인자로 들어갑니다</small><input name="name" value="{{.User.Name}}" required maxlength="30"></label>
    <button>이름 저장</button>
  </form>
</div>
{{end}}
<div class="card narrowcard">
  <h1>비밀번호 변경</h1>
  {{if .User.MustChange}}<p class="flash warn">임시 비밀번호로 로그인했습니다. 계속하려면 비밀번호를 변경해 주세요.</p>{{end}}
  <form method="post" action="/password">
    <input type="hidden" name="csrf" value="{{.User.CSRF}}">
    <label>현재 비밀번호<input type="password" name="current" required autocomplete="current-password"></label>
    <label>새 비밀번호 <small>10자 이상, 영문 대·소문자/숫자/특수문자 중 3종</small><input type="password" name="new" required autocomplete="new-password"></label>
    <label>새 비밀번호 확인<input type="password" name="confirm" required autocomplete="new-password"></label>
    <button class="primary">변경</button>
  </form>
</div>
{{end}}
