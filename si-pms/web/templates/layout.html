<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · SI-PMS</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
{{if .User}}
<header class="top">
  <a class="brand" href="/">{{.Project}}</a>
  <nav>
    <a href="/" {{if eq .Path "/"}}class="on"{{end}}>현황</a>
    <a href="/people" {{if hasPrefix .Path "/people"}}class="on"{{end}}>인력</a>
    <a href="/assets" {{if hasPrefix .Path "/assets"}}class="on"{{end}}>PC·자산</a>
    <a href="/nac" {{if hasPrefix .Path "/nac"}}class="on"{{end}}>IP·NAC</a>
    <a href="/docs" {{if hasPrefix .Path "/docs"}}class="on"{{end}}>서약·교육</a>
    <a href="/exports" {{if hasPrefix .Path "/exports"}}class="on"{{end}}>대장 출력</a>
    {{if .User.IsAdmin}}
    <a href="/qr" {{if hasPrefix .Path "/qr"}}class="on"{{end}}>등록 QR</a>
    <a href="/jobs" {{if hasPrefix .Path "/jobs"}}class="on"{{end}}>자동 작업</a>
    <a href="/settings" {{if hasPrefix .Path "/settings"}}class="on"{{end}}>설정</a>
    <a href="/audit" {{if hasPrefix .Path "/audit"}}class="on"{{end}}>감사로그</a>
    {{end}}
  </nav>
  <div class="me">
    <a href="/password" title="내 정보·비밀번호">{{.User.Name}}{{if not .User.IsAdmin}} (조회전용){{end}}</a>
    <form method="post" action="/logout" class="inline"><button class="link">로그아웃</button></form>
  </div>
</header>
{{end}}
<main {{if not .User}}class="narrow"{{end}}>
  {{if .Msg}}<div class="flash">{{.Msg}}</div>{{end}}
  {{if .Err}}<div class="flash err">{{.Err}}</div>{{end}}
  {{template "content" .}}
</main>
</body>
</html>
